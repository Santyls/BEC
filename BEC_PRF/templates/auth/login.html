<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            if (localStorage.getItem('bec-theme') === 'dark') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - BEC Recepción</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <style>
        body { background-color: #F1F5F9; color: #0F172A; }
        .glass { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(10px); border: 1px solid rgba(15, 23, 42, 0.08); }

        .dark body { background-color: #0f172a; color: #f8fafc; }
        .dark .glass { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black tracking-tighter text-emerald-500 uppercase">BEC<span class="text-slate-900 dark:text-white">_Recepción</span></h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Acceso exclusivo para personal de mostrador</p>
        </div>

        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensaje in mensajes %}
                <div class="mb-4 px-4 py-3 rounded-lg text-sm bg-rose-500/10 border border-rose-500/30 text-rose-700 dark:text-rose-400">
                    {{ mensaje }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.iniciar_sesion') }}" class="glass rounded-2xl p-8 space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="text-xs uppercase tracking-widest text-slate-500 dark:text-slate-400">Correo</label>
                <input type="email" name="correo" required autofocus
                    class="w-full mt-1 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
            <div>
                <label class="text-xs uppercase tracking-widest text-slate-500 dark:text-slate-400">Contraseña</label>
                <input type="password" name="password" required
                    class="w-full mt-1 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition-all">
                Iniciar sesión
            </button>
        </form>
    </div>
</body>
</html>
