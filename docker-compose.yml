services:
  # 1. API Principal (FastAPI)
  bec_api:
    build:
      context: ./BEC_API
    container_name: bec_api_app
    restart: unless-stopped
    ports:
      - "8000:5000"
    volumes:
      - ./BEC_API:/app
    environment:
      # Credenciales y configuración JWT — vienen de .env, nunca hardcodeadas aquí
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db_postgres:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS}
      # Envío de correo (recuperar contraseña) — opcional: si no se definen, el
      # código se imprime en los logs del contenedor en vez de enviarse.
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
    depends_on:
      # Espera a que Postgres esté realmente listo, no solo iniciado
      db_postgres:
        condition: service_healthy
    networks:
      - bec_network

  # 2. Portal Centros (Flask) — OBSOLETO.
  # Era el portal web del rol Ciudadano de una entrega anterior (materia de páginas web);
  # ese alcance se migró por completo a la app móvil. Se deja comentado para no construirlo
  # en cada `docker compose up`. Borrar el bloque (o la carpeta BEC_PCF) cuando el equipo confirme.
  # bec_pcf:
  #   build:
  #     context: ./BEC_PCF
  #   container_name: bec_pcf_app
  #   restart: unless-stopped
  #   ports:
  #     - "8001:5000"
  #   volumes:
  #     - ./BEC_PCF:/app
  #   networks:
  #     - bec_network

  # 3. Portal Receptores (Flask)
  bec_prf:
    build:
      context: ./BEC_PRF
    container_name: bec_prf_app
    restart: unless-stopped
    ports:
      - "8002:5000"
    volumes:
      - ./BEC_PRF:/app
    environment:
      # Mismo patrón que BEC_PAL: BEC_PRF tampoco toca Postgres directamente,
      # todo pasa por BEC_API.
      - BEC_API_URL=http://bec_api:5000
      # Distinta de BEC_API_URL: esa es solo alcanzable servidor-a-servidor dentro de
      # Docker; esta es la que el navegador del recepcionista necesita para pedir
      # archivos estáticos servidos por la API (fotos de perfil, etc.).
      - BEC_API_PUBLIC_URL=${BEC_API_PUBLIC_URL}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
    depends_on:
      - bec_api
    networks:
      - bec_network

  # 4. Portal Admin (Laravel)
  bec_pal:
    build:
      context: ./BEC_PAL
    container_name: bec_pal_app
    restart: unless-stopped
    ports:
      - "8003:8000"
    working_dir: /app
    volumes:
      - ./BEC_PAL:/app
    environment:
      # BEC_PAL NO habla con Postgres directamente ni con Eloquent: toda la
      # data de negocio (usuarios, albergues, donaciones...) pasa por BEC_API,
      # que ya trae JWT, validaciones y reglas de negocio. Así no se duplica
      # lógica ni hay dos ORMs mutando el mismo esquema por su cuenta.
      - BEC_API_URL=http://bec_api:5000
      - BEC_API_PUBLIC_URL=${BEC_API_PUBLIC_URL}
    depends_on:
      - bec_api
    networks:
      - bec_network

  # 5. Base de Datos PostgreSQL para la API
  db_postgres:
    image: postgres:15-alpine
    container_name: bec_db_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bec_network

# ==========================================
# AQUÍ ESTÁ LA SOLUCIÓN AL ERROR:
# Declaramos la red para que exista
# ==========================================
networks:
  bec_network:
    driver: bridge

volumes:
  postgres_data: # <--- NUEVO: Guarda la info de Postgres físicamente
