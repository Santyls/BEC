global
    log stdout format raw local0
    maxconn 4096

    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode http
    option httplog
    option forwardfor

    timeout connect 5s
    timeout client 30s
    timeout server 30s

    # Failover transparente. Sin esto, cuando una réplica de la API se cae,
    # HAProxy sigue mandándole tráfico hasta que el health check la marca DOWN
    # (con `check inter 30s` y `fall 3` eso tarda hasta 90 segundos), y durante
    # esa ventana ~1 de cada 3 peticiones falla. Medido: al detener api2,
    # solo 13 de 20 peticiones respondían.
    # `retries` + `redispatch` hacen que una conexión fallida se reintente al
    # instante en OTRO servidor del backend, así el usuario no ve ningún error
    # aunque el health check todavía no se haya enterado.
    retries 3
    option redispatch

# --- Tabla de seguimiento por IP (anti-DDoS / fuerza bruta) ---
# Guarda cuántas peticiones lleva cada IP en los últimos 10 segundos.
# Los frontends de abajo la consultan para rechazar a quien se pase del
# límite. `expire 5m`: una IP que deja de atacar se olvida sola a los 5 min.
backend st_abuse
    stick-table type ip size 100k expire 5m store http_req_rate(10s),conn_rate(10s)

# --- Puerto 80: todo se redirige a HTTPS ---
frontend http_front
    bind *:80
    http-request redirect scheme https code 301

# --- Puerto 443: BEC_PAL (portal admin), con /grafana como sub-path ---
frontend admin_front
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/server.pem
    # Sin esto, Laravel/Flask no saben que la petición original venía por
    # HTTPS (a ellos les llega en HTTP plano, por la red privada) y generan
    # links/redirects con http:// — rompe el login en el navegador.
    http-request set-header X-Forwarded-Proto https

    # Anti-DDoS: cuenta las peticiones de cada IP y rechaza con 429 a quien
    # pase de 100 en 10 segundos. Un navegador normal no se acerca a eso;
    # una ráfaga automatizada sí. Ver backend st_abuse.
    http-request track-sc0 src table st_abuse
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }

    acl path_grafana path_beg /grafana
    use_backend grafana_back if path_grafana

    default_backend pal_back

# --- Puerto 8444: BEC_PRF (portal recepción) ---
frontend recepcion_front
    bind *:8444 ssl crt /usr/local/etc/haproxy/certs/server.pem
    http-request set-header X-Forwarded-Proto https
    http-request track-sc0 src table st_abuse
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
    default_backend prf_back

# --- Puerto 8446: BEC_API, balanceada entre las 3 réplicas ---
frontend api_front
    bind *:8446 ssl crt /usr/local/etc/haproxy/certs/server.pem
    http-request set-header X-Forwarded-Proto https
    http-request track-sc0 src table st_abuse
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
    default_backend api_back

backend pal_back
    option httpchk GET /login
    http-check expect status 200
    # inter 30s: por default HAProxy chequea cada 2s — contra un `php artisan
    # serve` de un solo hilo, eso compite con las peticiones reales de login
    # (CSRF/sesión se pisan). No hace falta esa frecuencia para una demo.
    server pal 10.116.0.3:5002 check inter 30s

backend prf_back
    option httpchk GET /login
    http-check expect status 200
    server prf 10.116.0.3:5001 check inter 30s

backend api_back
    balance roundrobin

    option httpchk GET /health
    http-check expect status 200

    # Chequeo agresivo (a diferencia de pal/prf): uvicorn es asíncrono y aguanta
    # sin problema un /health cada 2s. `fall 2` = se marca DOWN tras 2 fallos
    # seguidos, o sea ~4 segundos en vez de los 90 del ajuste anterior.
    # `rise 2` = vuelve a entrar en rotación igual de rápido al recuperarse.
    server api1 10.116.0.3:8001 check inter 2s fall 2 rise 2
    server api2 10.116.0.3:8002 check inter 2s fall 2 rise 2
    server api3 10.116.0.3:8003 check inter 2s fall 2 rise 2

backend grafana_back
    server grafana grafana:3000 check

# --- Stats de HAProxy (protegidas con usuario/contraseña, ver .env) ---
listen stats
    bind *:8404
    mode http

    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node
    # OJO: pon aquí la contraseña real EN EL SERVIDOR, no en el repositorio.
    # No se puede usar ${STATS_PASSWORD} — HAProxy no expande variables de
    # entorno en esta directiva (probado: toma el texto literal como contraseña).
    stats auth admin:CAMBIA_ESTA_CONTRASENA

# --- Métricas de HAProxy para que Prometheus las scrapee ---
frontend prometheus_front
    bind *:8405
    mode http

    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 404
